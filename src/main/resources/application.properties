spring.application.name=vagai
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
vagai.origem=${FRONTEND_ORIGIN:http://localhost:5173}
vagai.osm.bbox=${OSM_BBOX:-23.57,-46.66,-23.54,-46.63}
vagai.osm.timeout=${OSM_TIMEOUT:30}
vagai.osm.url=${OSM_URL:https://overpass-api.de/api/interpreter}
